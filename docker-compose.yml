version: '3.8'

services:
  api:
    build:
      context: .
      target: production
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/tourguide?schema=public
      - NODE_ENV=production
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - tour-guide-network
    command: sh -c "sleep 10 && npx prisma migrate deploy && node dist/main"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tourguide
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tour-guide-network
    restart: unless-stopped

networks:
  tour-guide-network:
    driver: bridge

volumes:
  postgres_data:
